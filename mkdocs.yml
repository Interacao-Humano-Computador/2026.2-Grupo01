site_name: Interação Humano-Computador - Grupo 01

site_description: Site do Grupo 01 da disciplina de Interação Humano-Computador

site_author: Grupo 01

repo_name: Interacao-Humano-Computador/2026.2-Grupo01

repo_url: https://github.com/Interacao-Humano-Computador/2026.2-Grupo01

theme:
  name: material
  language: pt-BR

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Modo escuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Modo claro

nav:
  - Início: index.md

  
  - Planejamento:
    - Heatmap: planejamento/heatmap.md
    - Processo de Design: planejamento/processo_de_design.md
    - Ferramentas: planejamento/ferramentas.md
    - Site Escolhido: planejamento/site_escolhido.md
    - Sites Avaliados: planejamento/sites_avaliados.md
    - Contribuição: planejamento/cronograma/contribuicao.md
    - Cronograma Planejado: planejamento/cronograma/cronograma_planejado.md
    - Cronograma Executado: planejamento/cronograma/cronograma_executado.md
    - Cronograma e Roteiro da Entrevista — Storyboard SB-A: "planejamento/cronograma/Cronograma e Roteiro da Entrevista — Storyboard SB-A.md"
    - Avaliação Formativa (DECIDE): planejamento/planejamento_avaliacao_decide.md
    - Relato dos Resultados: planejamento/planejamento_relato_resultados.md


  - Análise de Requisitos:
    - Coleta de dados:
      - Coleta de dados: analise_de_requisitos/coleta_de_dados.md
      - Entrevista Rayca: Entrevistas/entrevista_rayca.md
      - Entrevista João: Entrevistas/entrevista_joao.md
    - Perfil de usuário: analise_de_requisitos/perfil_usuarios.md
    - Personas: analise_de_requisitos/personas.md
    - Cenários: analise_de_requisitos/cenarios.md
    - Análise de Tarefas:
      - Análise Hierárquica de Tarefas: analise_de_requisitos/analise_de_tarefas/hta.md
      - Árvores de Tarefas Concorrentes: analise_de_requisitos/analise_de_tarefas/ctt.md
    - Princípios Gerais do projeto: analise_de_requisitos/principios_gerais.md
    - Características Gerais: analise_de_requisitos/caracteristicas_gerais.md
    - Guia de Estilo: analise_de_requisitos/guia_estilo.md
    - Metas de usabilidade: analise_de_requisitos/metas_usabilidade.md


  - Design, avaliação, desenvolvimento:
    - Nível 1:
      - Storyboard:
        - Planejamento da avaliação: planejamento/storyboard/planejamento_avaliacao_storyboard.md
        - Planejamento do relato dos resultados: planejamento/storyboard/planejamento_relato_resultados_storyboard.md
        - Relato dos resultados: design_avaliacao_desenvolvimento/nivel_1/storyboard/relato_resultados_storyboard.md
        - Relato dos resultados Evellyn : design_avaliacao_desenvolvimento/nivel_1/storyboard/relato_resultado_storyboard_evellyn.md
      - Análise de tarefas:
        -  Planejamento Avaliação Formativa (DECIDE): planejamento/planejamento_avaliacao_decide.md
        -  Planejamento Relato dos Resultados: planejamento/planejamento_relato_resultados.md
        -  Relato dos resultados: design_avaliacao_desenvolvimento/nivel_1/analise_tarefas/relato_resultados_analise_tarefas.md
        -  Relato de resultados Evellyn: design_avaliacao_desenvolvimento/nivel_1/analise_tarefas/relato-resultado-evellyn.md
    - Nível 2:
      - Protótipo de papel:
        - Planejamento da avaliação: design_avaliacao_desenvolvimento/nivel_2/prototipo_papel/planejamento_prototipo_papel.md
        - Planejamento do relato de resultados: design_avaliacao_desenvolvimento/nivel_2/prototipo_papel/planejamento_relato_prototipo_papel.md
        - Relato dos resultados: design_avaliacao_desenvolvimento/nivel_2/prototipo_papel/resultados_prototipo_papel.md


  - Atas e Apresentações: atas/reunioes.md
  - Inspeções: inspecoes/inspecao.md
  - Entrevistas: Entrevistas/entrevistas.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - md_in_html
  - toc:
      permalink: true
